# Scenario: The incident switchboard

# Your release train from the previous exercise is running, but the team has a new problem. When something breaks in production at 2 AM, the on-call engineer has to run the pipeline by hand and wait through every stage just to get one piece of information. Nobody wants the full run. They want to choose what happens.

# The team has asked for a single workflow that behaves differently depending on who starts it, how they start it, and what they ask for. Build it.

# Create a workflow called Incident Switchboard in the same repository as your release train.

# Triggers

# The workflow runs on a push to main, on a pull request against main, and by hand.

# When started by hand, the engineer must be offered:
#   - a choice of severity, one of low, medium or high, defaulting to low
#   - a tickbox called deep_scan, defaulting to unticked
#   - a tickbox called skip_tests, defaulting to unticked
#   - a free text box called reason, with no default

# The run title must show the severity in capitals and the word SCAN when a deep scan was requested, so that the run list is readable without opening anything. A run started by a push or a pull request must still produce a sensible title.

# Job 1: triage

# Always runs.

# Prints the event that started the run, the ref, who started it and the run number.

# When the run was started by hand, prints the severity, whether a deep scan was asked for, whether tests were skipped, and the reason given. When it was not started by hand, prints a line saying the run was automatic and no reason was supplied.

# Prints a different line for each severity level. Low, medium and high must each produce their own message.

# Job 2: tests

# Runs after triage.

# Does not run at all when the engineer ticked skip_tests. It must still run for pushes and pull requests, where that tickbox does not exist.

# Checks out the repository, sets up Node, installs dependencies and runs the test suite inside the app folder.

# Job 3: scan

# Runs after triage.

# Only runs when a deep scan was requested, or when the severity is high. A high severity run gets the scan whether or not the box was ticked.

# Installs jq. Writes a file called scan.json holding the severity, the deep scan flag, the actor, the run number and the time in UTC. Reads two values back out with jq and prints them.

# Job 4: report

# Runs after both tests and scan, and must run even when one of them was skipped or failed.

# Prints whether the tests job succeeded, was skipped or failed. Prints the same for the scan job.

# Prints one summary line that differs depending on whether everything that ran was successful.

# Finishes by printing "Switchboard closed".
name: Incident Switchboard

run-name: >-
  Incident Switchboard -
  ${{ github.event_name == 'workflow_dispatch' && inputs.severity || 'AUTOMATIC' }}
  ${{ github.event_name == 'workflow_dispatch' && inputs.deep_scan && 'SCAN' || '' }}

on:
  # push:
  #   branches:
  #     - main

  # pull_request:
  #   branches:
  #     - main

  workflow_dispatch:
    inputs:
      severity:
        description: "Incident severity"
        type: choice
        options:
          - low
          - medium
          - high
        default: low
        required: true

      deep_scan:
        description: "Request a deep scan"
        type: boolean
        default: false
        required: true

      skip_tests:
        description: "Skip tests"
        type: boolean
        default: false
        required: true

      reason:
        description: "Reason for the incident run"
        type: string
        required: false

jobs:
  triage:
    runs-on: ubuntu-latest

    steps:
      - name: Print run information
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          echo "Actor: ${{ github.actor }}"
          echo "Run number: ${{ github.run_number }}"

      - name: Print manual run details
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "Severity: ${{ inputs.severity }}"
          echo "Deep scan: ${{ inputs.deep_scan }}"
          echo "Tests skipped: ${{ inputs.skip_tests }}"
          echo "Reason: ${{ inputs.reason }}"

      - name: Print automatic run details
        if: github.event_name != 'workflow_dispatch'
        run: |
          echo "This run was automatic and no reason was supplied."

      - name: Low severity
        if: github.event_name != 'workflow_dispatch' || inputs.severity == 'low'
        run: echo "Low severity incident."

      - name: Medium severity
        if: github.event_name == 'workflow_dispatch' && inputs.severity == 'medium'
        run: echo "Medium severity incident."

      - name: High severity
        if: github.event_name == 'workflow_dispatch' && inputs.severity == 'high'
        run: echo "High severity incident."

  tests:
    needs: triage
    runs-on: ubuntu-latest
    if: |
      github.event_name != 'workflow_dispatch' ||
      !inputs.skip_tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: app
        run: npm install

      - name: Run tests
        working-directory: app
        run: npm test

  scan:
    needs: triage
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' &&
      (inputs.deep_scan || inputs.severity == 'high')

    steps:
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Create scan data
        env:
          SEVERITY: ${{ inputs.severity }}
          DEEP_SCAN: ${{ inputs.deep_scan }}
          ACTOR: ${{ github.actor }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          cat > scan.json <<EOF
          {
            "severity": "$SEVERITY",
            "deep_scan": "$DEEP_SCAN",
            "actor": "$ACTOR",
            "run_number": "$RUN_NUMBER",
            "time_utc": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          }
          EOF

      - name: Read scan values
        run: |
          echo "Severity: $(jq -r '.severity' scan.json)"
          echo "Run number: $(jq -r '.run_number' scan.json)"

  report:
    needs:
      - tests
      - scan
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Report tests status
        run: |
          if [ "${{ needs.tests.result }}" = "success" ]; then
            echo "Tests: succeeded"
          elif [ "${{ needs.tests.result }}" = "skipped" ]; then
            echo "Tests: skipped"
          else
            echo "Tests: failed"
          fi

      - name: Report scan status
        run: |
          if [ "${{ needs.scan.result }}" = "success" ]; then
            echo "Scan: succeeded"
          elif [ "${{ needs.scan.result }}" = "skipped" ]; then
            echo "Scan: skipped"
          else
            echo "Scan: failed"
          fi

      - name: Print summary
        run: |
          if [ "${{ needs.tests.result }}" = "success" ] && \
             [ "${{ needs.scan.result }}" = "success" ]; then
            echo "Everything that ran was successful."
          else
            echo "One or more jobs were skipped or failed."
          fi

          echo "Switchboard closed"