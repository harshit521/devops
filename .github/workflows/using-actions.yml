name: using-actions
on: push
jobs:
    build:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: my-react-app
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '24.x'
            - name: Install dependencies
              run: npm install
            - name: Run tests
              run: npm test
              