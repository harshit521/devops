name: System Report

on:
  workflow_dispatch:

jobs:
  system-info:
    runs-on: ubuntu-latest

    steps:
      - name: Print OS and kernel
        run: |
          echo "OS:"
          uname -o
          echo "Kernel:"
          uname -r

      - name: Print free disk space
        run: |
          echo "Free disk space:"
          df -h /

      - name: Print current date and time
        run: |
          echo "Current date and time:"
          date

      - name: Install tree
        run: |
          sudo apt-get update
          sudo apt-get install -y tree

      - name: Display home directory structure
        run: |
          tree -L 2 "$HOME"


  tool-check:
    runs-on: ubuntu-latest

    steps:
      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Create report.json
        run: |
          cat > report.json <<'EOF'
          {
            "project": "system-report",
            "status": "success",
            "environment": "github-actions"
          }
          EOF

      - name: Read value using jq
        run: |
          jq '.project' report.json

      - name: Print tool versions
        run: |
          python3 --version
          git --version
          jq --version

      - name: Complete report
        run: |
          echo "Report complete"